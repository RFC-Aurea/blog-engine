<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <!-- Shared parts for engine illustrations. Use with <use href="#name" x y width height/>.
       Neutral, natural tissue tones only; no brand colours. Each symbol's viewBox is its own drawing space. -->
  <defs>
    <radialGradient id="g-myo" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#EBC8B9"/><stop offset="1" stop-color="#D3A391"/>
    </radialGradient>
    <linearGradient id="g-endo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1D3C6"/><stop offset="1" stop-color="#E9C0B1"/>
    </linearGradient>
    <radialGradient id="g-ovary" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#F2E4D6"/><stop offset="1" stop-color="#DEC5AF"/>
    </radialGradient>
    <radialGradient id="g-follicle" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFFBF4"/><stop offset="1" stop-color="#F3E7D6"/>
    </radialGradient>
    <radialGradient id="g-ooplasm" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFF9F0"/><stop offset="1" stop-color="#EBD8BD"/>
    </radialGradient>
    <radialGradient id="g-sperm-head" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#C9BCAD"/><stop offset="1" stop-color="#8F8173"/>
    </radialGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="0.5" stop-color="#DCE3E6" stop-opacity="0.75"/><stop offset="1" stop-color="#C2CCD0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9BDC0"/><stop offset="0.35" stop-color="#ECEEEF"/><stop offset="0.7" stop-color="#C9CDD0"/><stop offset="1" stop-color="#A7ACB0"/>
    </linearGradient>
    <linearGradient id="g-vagina" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="262">
      <stop offset="0" stop-color="#EFD3C6"/><stop offset="0.6" stop-color="#EFD3C6"/><stop offset="1" stop-color="#EFD3C6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g-vagina-line" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="262">
      <stop offset="0" stop-color="#C99785"/><stop offset="0.6" stop-color="#C99785"/><stop offset="1" stop-color="#C99785" stop-opacity="0"/>
    </linearGradient>
    <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6B5A4A" flood-opacity="0.16"/>
    </filter>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9C9186"/>
    </marker>
  </defs>

  <!-- ===== Oocyte (egg) with zona pellucida and corona cells ===== -->
  <symbol id="oocyte" viewBox="-62 -62 124 124">
    <g fill="#EEDFC9" stroke="#DCC7AA" stroke-width="1">
      <circle cx="0" cy="-54" r="6"/><circle cx="27" cy="-47" r="6"/><circle cx="47" cy="-27" r="6"/><circle cx="54" cy="0" r="6"/>
      <circle cx="47" cy="27" r="6"/><circle cx="27" cy="47" r="6"/><circle cx="0" cy="54" r="6"/><circle cx="-27" cy="47" r="6"/>
      <circle cx="-47" cy="27" r="6"/><circle cx="-54" cy="0" r="6"/><circle cx="-47" cy="-27" r="6"/><circle cx="-27" cy="-47" r="6"/>
    </g>
    <circle r="44" fill="#F6ECDD" stroke="#D9C3A5" stroke-width="2"/>
    <circle r="38" fill="#FBF5EC"/>
    <circle r="34" fill="url(#g-ooplasm)" stroke="#D8C2A3" stroke-width="1.2"/>
    <g fill="#E3CFB2"><circle cx="-12" cy="6" r="1.6"/><circle cx="8" cy="12" r="1.4"/><circle cx="14" cy="-6" r="1.5"/><circle cx="-4" cy="-14" r="1.3"/><circle cx="-18" cy="-8" r="1.2"/><circle cx="2" cy="22" r="1.3"/><circle cx="20" cy="8" r="1.1"/></g>
    <circle cx="27" cy="-23" r="5" fill="#F0E2CC" stroke="#D3BC9B" stroke-width="1"/>
  </symbol>

  <!-- ===== Sperm, head pointing left (0,0 = tip of head) ===== -->
  <symbol id="sperm" viewBox="-4 -16 172 32">
    <path d="M44,0 C58,-8 70,8 84,0 C98,-8 110,8 124,0 C138,-8 150,7 166,0" fill="none" stroke="#9E9183" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="22" y="-3.2" width="22" height="6.4" rx="3" fill="#A39686"/>
    <ellipse cx="12" cy="0" rx="12" ry="8" fill="url(#g-sperm-head)"/>
    <path d="M12,-8 A12,8 0 0,0 12,8 C6,6 2,3 1,0 C2,-3 6,-6 12,-8 Z" fill="#DCD3C8" opacity="0.85"/>
  </symbol>

  <!-- ===== Day-5 blastocyst: zona, trophectoderm ring, cavity, inner cell mass at upper left ===== -->
  <symbol id="blastocyst" viewBox="-62 -62 124 124">
    <circle r="56" fill="#F7EEE1" stroke="#D9C3A5" stroke-width="2"/>
    <circle r="50" fill="#EFDCC3" stroke="#D6BD9C" stroke-width="1.4"/>
    <circle r="42" fill="#FDF9F2" stroke="#DCC6A8" stroke-width="1.2"/>
    <g stroke="#D6BD9C" stroke-width="1.2">
      <line x1="42" y1="0" x2="50" y2="0"/><line x1="36.4" y1="21" x2="43.3" y2="25"/><line x1="21" y1="36.4" x2="25" y2="43.3"/>
      <line x1="0" y1="42" x2="0" y2="50"/><line x1="-21" y1="36.4" x2="-25" y2="43.3"/><line x1="-36.4" y1="21" x2="-43.3" y2="25"/>
      <line x1="-42" y1="0" x2="-50" y2="0"/><line x1="-36.4" y1="-21" x2="-43.3" y2="-25"/><line x1="-21" y1="-36.4" x2="-25" y2="-43.3"/>
      <line x1="0" y1="-42" x2="0" y2="-50"/><line x1="21" y1="-36.4" x2="25" y2="-43.3"/><line x1="36.4" y1="-21" x2="43.3" y2="-25"/>
    </g>
    <g fill="#E7CFAF" stroke="#CDB08C" stroke-width="1.1">
      <circle cx="-20" cy="-26" r="8.5"/><circle cx="-6" cy="-31" r="8"/><circle cx="-30" cy="-13" r="8"/><circle cx="-14" cy="-13" r="8.5"/>
      <circle cx="0" cy="-19" r="7.5"/><circle cx="-24" cy="1" r="7"/>
    </g>
  </symbol>

  <!-- ===== Ovary in cross-section with follicles; dominant follicle holds an egg (right side) ===== -->
  <symbol id="ovary-section" viewBox="-160 -105 320 210">
    <ellipse rx="150" ry="95" fill="url(#g-ovary)" stroke="#C9AE95" stroke-width="2"/>
    <g fill="#E9D7C3" opacity="0.7">
      <circle cx="-120" cy="-30" r="3"/><circle cx="-128" cy="10" r="3"/><circle cx="-110" cy="45" r="3"/><circle cx="-70" cy="-78" r="3"/>
      <circle cx="-30" cy="-88" r="3"/><circle cx="10" cy="86" r="3"/><circle cx="-40" cy="84" r="3"/><circle cx="120" cy="-55" r="3"/>
    </g>
    <g fill="url(#g-follicle)" stroke="#D6BFA4" stroke-width="1.6">
      <circle cx="-95" cy="-10" r="17"/><circle cx="-62" cy="-50" r="13"/><circle cx="-60" cy="35" r="21"/>
      <circle cx="-18" cy="-55" r="18"/><circle cx="-18" cy="58" r="14"/><circle cx="-28" cy="0" r="11"/>
    </g>
    <circle cx="62" cy="2" r="62" fill="url(#g-follicle)" stroke="#D2B899" stroke-width="2"/>
    <circle cx="62" cy="2" r="62" fill="none" stroke="#EAD9C1" stroke-width="9" opacity="0.9"/>
    <path d="M22,48 C34,30 58,26 74,34 C88,42 92,56 86,60 C70,62 40,62 22,48 Z" fill="#EEDFC8" stroke="#D8C2A3" stroke-width="1.2"/>
    <use href="#oocyte" x="44" y="10" width="38" height="38"/>
  </symbol>

  <!-- ===== Ovary in POI: few resting follicles, one waking (growing) follicle; same frame as ovary-section ===== -->
  <symbol id="ovary-poi" viewBox="-160 -105 320 210">
    <ellipse rx="146" ry="90" fill="url(#g-ovary)" stroke="#C9AE95" stroke-width="2"/>
    <g fill="#E9D7C3" opacity="0.7">
      <circle cx="-118" cy="-22" r="3"/><circle cx="-60" cy="-74" r="3"/><circle cx="4" cy="80" r="3"/><circle cx="112" cy="-50" r="3"/><circle cx="-100" cy="40" r="3"/>
    </g>
    <g fill="url(#g-follicle)" stroke="#D6BFA4" stroke-width="1.6">
      <circle cx="-88" cy="-12" r="10"/><circle cx="-46" cy="46" r="9"/><circle cx="-20" cy="-54" r="8"/>
    </g>
    <circle cx="58" cy="6" r="40" fill="url(#g-follicle)" stroke="#D2B899" stroke-width="2"/>
    <circle cx="58" cy="6" r="40" fill="none" stroke="#EAD9C1" stroke-width="7" opacity="0.9"/>
    <use href="#oocyte" x="44" y="10" width="28" height="28"/>
  </symbol>

  <!-- ===== Uterus body, cervix and upper vagina, frontal section (lining shown thick) ===== -->
  <symbol id="uterus-body" viewBox="-110 -165 220 430">
    <g id="uterus-body-g">
      <path d="M-60,108 C-72,160 -72,215 -68,262 L68,262 C72,215 72,160 60,108 C48,98 -48,98 -60,108 Z" fill="url(#g-vagina)"/>
      <path d="M-68,262 C-72,215 -72,160 -60,108 C-48,98 48,98 60,108 C72,160 72,215 68,262" fill="none" stroke="url(#g-vagina-line)" stroke-width="1.6"/>
      <path d="M-34,164 C-40,200 -40,232 -38,262 M34,164 C40,200 40,232 38,262" fill="none" stroke="#DDB2A1" stroke-width="1.4"/>
      <path d="M-96,-62 C-106,-150 106,-150 96,-62 C92,-12 70,38 46,74 C40,92 38,112 38,140 C38,162 -38,162 -38,140 C-38,112 -40,92 -46,74 C-70,38 -92,-12 -96,-62 Z" fill="url(#g-myo)" stroke="#B98674" stroke-width="2"/>
      <path d="M-72,-80 C-64,-120 64,-120 72,-80 C62,-36 34,20 16,72 L-16,72 C-34,20 -62,-36 -72,-80 Z" fill="url(#g-endo)" stroke="#D5A592" stroke-width="1.4"/>
      <g fill="none" stroke="#DFAF9E" stroke-width="1.3" stroke-linecap="round">
        <path d="M-48,-104 c2,3 -1,6 1,9"/><path d="M-26,-109 c2,3 -1,6 1,9"/><path d="M0,-111 c2,3 -1,6 1,9"/><path d="M26,-109 c2,3 -1,6 1,9"/><path d="M48,-104 c2,3 -1,6 1,9"/>
        <path d="M-64,-74 c5,2 5,7 10,9"/><path d="M62,-76 c-5,2 -5,7 -10,9"/><path d="M-48,-30 c5,2 5,7 10,9"/><path d="M46,-32 c-5,2 -5,7 -10,9"/>
        <path d="M-30,18 c5,2 4,7 9,9"/><path d="M30,18 c-5,2 -4,7 -9,9"/>
      </g>
      <path d="M-54,-82 C-42,-102 42,-102 54,-82 C42,-42 20,8 6,62 L-6,62 C-20,8 -42,-42 -54,-82 Z" fill="#FAEDE6" stroke="#E2BBAC" stroke-width="1"/>
      <path d="M-6,62 C-10,90 -10,120 -5,160 L5,160 C10,120 10,90 6,62 Z" fill="#F5DED4" stroke="#DDB2A1" stroke-width="1"/>
    </g>
  </symbol>

  <!-- ===== Uterus with tubes and ovaries (same drawing space as uterus-body, wider viewBox) ===== -->
  <symbol id="uterus" viewBox="-235 -165 470 430">
    <g id="adnexa-l">
      <path d="M-92,-112 C-136,-132 -182,-126 -202,-96 C-214,-76 -212,-56 -202,-44" fill="none" stroke="#D3A694" stroke-width="15" stroke-linecap="round"/>
      <path d="M-92,-112 C-136,-132 -182,-126 -202,-96 C-214,-76 -212,-56 -202,-44" fill="none" stroke="#EFD3C7" stroke-width="5" stroke-linecap="round"/>
      <g stroke="#D3A694" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M-202,-44 C-206,-34 -212,-28 -218,-24"/><path d="M-202,-44 C-200,-32 -200,-24 -204,-16"/><path d="M-202,-44 C-194,-36 -188,-30 -186,-22"/>
      </g>
      <path d="M-98,-70 C-120,-56 -136,-40 -150,-28" fill="none" stroke="#D3A694" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(-170,-8) rotate(-18)">
        <ellipse rx="36" ry="23" fill="url(#g-ovary)" stroke="#C9AE95" stroke-width="1.6"/>
        <circle cx="-12" cy="-4" r="6" fill="#FAF2E6" stroke="#D6BFA4"/><circle cx="8" cy="6" r="8" fill="#FAF2E6" stroke="#D6BFA4"/><circle cx="16" cy="-9" r="5" fill="#FAF2E6" stroke="#D6BFA4"/>
      </g>
    </g>
    <use href="#adnexa-l" transform="scale(-1,1)"/>
    <use href="#uterus-body-g"/>
  </symbol>

  <!-- ===== Embryo transfer catheter (vertical, tip at 0,0) ===== -->
  <symbol id="catheter" viewBox="-14 -6 28 320">
    <rect x="-3.5" y="0" width="7" height="300" rx="3.5" fill="#F4F6F7" stroke="#A9B2B6" stroke-width="1.4"/>
    <rect x="-7" y="250" width="14" height="60" rx="4" fill="#DDE3E6" stroke="#A9B2B6" stroke-width="1.4"/>
  </symbol>

  <!-- ===== ICSI: holding pipette (left) and injection needle (right), horizontal ===== -->
  <symbol id="holding-pipette" viewBox="0 -24 200 48">
    <path d="M0,-20 L176,-20 C192,-20 198,-12 198,0 C198,12 192,20 176,20 L0,20 Z" fill="url(#g-glass)" stroke="#9FAAB0" stroke-width="1.4"/>
    <path d="M0,-6 L190,-6 L190,6 L0,6 Z" fill="#FFFFFF" opacity="0.55"/>
  </symbol>
  <symbol id="icsi-needle" viewBox="0 -10 220 20">
    <path d="M0,-7 L150,-6 L218,0 L150,6 L0,7 Z" fill="url(#g-glass)" stroke="#9FAAB0" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="200" y2="0" stroke="#FFFFFF" stroke-width="1.4" opacity="0.8"/>
  </symbol>
  <!-- ===== Large sperm cell for labelling (head centre at 70,0; tail tip at 558,0) ===== -->
  <symbol id="sperm-detail" viewBox="0 -60 560 120">
    <g fill="none" stroke-linecap="round">
      <path d="M214,0 C250,-15 285,15 320,0" stroke="#A39686" stroke-width="7"/>
      <path d="M320,0 C355,-15 390,15 425,0" stroke="#A39686" stroke-width="5"/>
      <path d="M425,0 C460,-13 495,13 530,0 C542,-5 550,-4 557,-1" stroke="#A39686" stroke-width="3"/>
    </g>
    <rect x="114" y="-6" width="14" height="12" rx="4" fill="#B5A898"/>
    <rect x="124" y="-9" width="92" height="18" rx="9" fill="#A89A8B"/>
    <g stroke="#8E8072" stroke-width="2" stroke-linecap="round">
      <path d="M134,-7 l-6,14"/><path d="M144,-8 l-6,16"/><path d="M154,-8 l-6,16"/><path d="M164,-8 l-6,16"/><path d="M174,-8 l-6,16"/>
      <path d="M184,-8 l-6,16"/><path d="M194,-8 l-6,16"/><path d="M204,-7 l-6,14"/>
    </g>
    <ellipse cx="70" cy="0" rx="50" ry="33" fill="url(#g-sperm-head)" stroke="#8C7E70" stroke-width="1.6"/>
    <ellipse cx="80" cy="0" rx="34" ry="22" fill="#8A7C6E" opacity="0.45"/>
    <path d="M88,-31 A50,33 0 0,0 88,31 C72,24 64,12 64,0 C64,-12 72,-24 88,-31 Z" fill="#E6DED4" opacity="0.92" stroke="#B9AC9D" stroke-width="1.2"/>
  </symbol>

  <!-- ===== Line icons for timelines (48x48, warm stone stroke) ===== -->
  <symbol id="icon-clipboard" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="8" width="28" height="34" rx="4" fill="#FFFFFF"/><rect x="17" y="5" width="14" height="7" rx="2" fill="#E7DCCD"/>
      <path d="M16,22 l3,3 l5,-6 M28,22 h5 M16,32 l3,3 l5,-6 M28,32 h5"/>
    </g>
  </symbol>
  <symbol id="icon-profile" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="10" width="36" height="28" rx="4" fill="#FFFFFF"/>
      <circle cx="17" cy="21" r="4.5" fill="#E7DCCD"/><path d="M10,32 c1.5,-5 12.5,-5 14,0"/><path d="M29,19 h8 M29,25 h8 M29,31 h5"/>
    </g>
  </symbol>
  <symbol id="icon-calendar" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="10" width="34" height="31" rx="4" fill="#FFFFFF"/><path d="M7,18 h34" /><path d="M15,6 v7 M33,6 v7"/>
      <rect x="13" y="23" width="6" height="5" rx="1" fill="#E7DCCD" stroke="none"/><rect x="21" y="23" width="6" height="5" rx="1" fill="#E7DCCD" stroke="none"/>
      <rect x="29" y="23" width="6" height="5" rx="1" fill="#E7DCCD" stroke="none"/><rect x="13" y="31" width="6" height="5" rx="1" fill="#E7DCCD" stroke="none"/>
      <rect x="21" y="31" width="6" height="5" rx="1" fill="#E7DCCD" stroke="none"/>
    </g>
  </symbol>
  <symbol id="icon-dish" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="28" rx="19" ry="9" fill="#FFFFFF"/><path d="M5,28 v3 c0,5 8.5,9 19,9 s19,-4 19,-9 v-3"/>
      <circle cx="24" cy="27" r="5.5" fill="#F3E7D4"/><circle cx="24" cy="27" r="2.2" fill="#E3CFB0" stroke="none"/>
      <path d="M33,8 l-6,13" /><path d="M31,6 l5,2"/>
    </g>
  </symbol>
  <symbol id="icon-uterus" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13,14 C13,5 35,5 35,14 C35,22 30,28 27,31 L27,38 L21,38 L21,31 C18,28 13,22 13,14 Z" fill="#F3DDD3"/>
      <path d="M13,12 C8,9 5,11 4,15 M35,12 C40,9 43,11 44,15"/>
      <path d="M18,13 C22,11 26,11 30,13 C28,18 26,22 24,26 C22,22 20,18 18,13 Z" fill="#FBEEE8" stroke-width="1.8"/>
    </g>
  </symbol>
  <symbol id="icon-drop" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24,6 C30,15 36,22 36,30 C36,37 30.6,42 24,42 C17.4,42 12,37 12,30 C12,22 18,15 24,6 Z" fill="#F1DED6"/>
      <path d="M19,31 c0,3 2,5 5,5" />
    </g>
  </symbol>
  <symbol id="icon-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="11" fill="#E7DCCD"/><path d="M7,12.5 l3.2,3.2 L17,8.8" fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="icon-cup" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="11" y="7" width="26" height="7" rx="2" fill="#E7DCCD"/>
      <path d="M13,14 L15,40 C15,42 17,43 19,43 L29,43 C31,43 33,42 33,40 L35,14 Z" fill="#FFFFFF"/>
      <path d="M17,28 h14" /><path d="M16,30 L17,39 C17,40 18,41 19.5,41 L28.5,41 C30,41 31,40 31,39 L32,30 Z" fill="#F1E9DD" stroke="none"/>
    </g>
  </symbol>
  <symbol id="icon-vial" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="17" y="4" width="14" height="8" rx="2" fill="#E7DCCD"/>
      <path d="M18,12 L18,38 C18,42 21,44 24,44 C27,44 30,42 30,38 L30,12 Z" fill="#FFFFFF"/>
      <path d="M19.5,26 L19.5,38 C19.5,41 21.5,42.5 24,42.5 C26.5,42.5 28.5,41 28.5,38 L28.5,26 Z" fill="#E4E0EA" stroke="none"/>
      <path d="M22,18 h4"/>
    </g>
  </symbol>
  <symbol id="icon-tank" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="18" y="4" width="12" height="6" rx="2" fill="#E7DCCD"/>
      <path d="M20,10 L20,13 C12,15 9,20 9,26 L9,38 C9,42 12,44 16,44 L32,44 C36,44 39,42 39,38 L39,26 C39,20 36,15 28,13 L28,10" fill="#FFFFFF"/>
      <path d="M9,30 h30" />
      <g stroke-width="1.8"><path d="M24,33 v8 M20.5,35 l7,4 M27.5,35 l-7,4"/></g>
    </g>
  </symbol>
  <symbol id="icon-phone" viewBox="0 0 48 48">
    <g fill="none" stroke="#5F574F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="13" y="4" width="22" height="40" rx="5" fill="#FFFFFF"/><path d="M21,9 h6"/><circle cx="24" cy="38" r="1.8" fill="#5F574F" stroke="none"/>
      <path d="M18,17 h12 v9 h-7 l-4,3 v-3 h-1 z" fill="#E7DCCD"/>
    </g>
  </symbol>
  <symbol id="icon-microscope" viewBox="0 0 48 48">
