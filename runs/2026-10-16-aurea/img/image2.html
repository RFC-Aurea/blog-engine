<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Sperm freezing at Aurea: every step and fee</text>
  <text class="subtitle" x="40" y="96">Freezing is a one-time fee. Storage is the number that grows, so plan for it from day one.</text>
  <path d="M130,182 L1070,182" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-phone" x="106" y="158" width="48" height="48"/>
    <circle class="badge" cx="97" cy="148" r="15"/><text class="badge-num" x="97" y="154" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="262" text-anchor="middle">Free nurse call</text>
    <text class="step-text" x="130" y="290" text-anchor="middle">20 minutes to talk</text>
    <text class="step-text" x="130" y="312" text-anchor="middle">through timing</text>
    <rect x="38" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="130" y="370" text-anchor="middle">Free</text>
  </g>
  <g>
    <circle cx="365" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="341" y="158" width="48" height="48"/>
    <circle class="badge" cx="332" cy="148" r="15"/><text class="badge-num" x="332" y="154" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="262" text-anchor="middle">Semen analysis</text>
    <text class="step-text" x="365" y="290" text-anchor="middle">Count and motility,</text>
    <text class="step-text" x="365" y="312" text-anchor="middle">AI-assisted</text>
    <rect x="273" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="365" y="370" text-anchor="middle">$300</text>
  </g>
  <g>
    <circle cx="600" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-snowflake" x="576" y="158" width="48" height="48"/>
    <circle class="badge" cx="567" cy="148" r="15"/><text class="badge-num" x="567" y="154" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="262" text-anchor="middle">Freeze a sample</text>
    <text class="step-text" x="600" y="290" text-anchor="middle">In the office, or at</text>
    <text class="step-text" x="600" y="312" text-anchor="middle">home (Adonis Kit)</text>
    <rect x="508" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="600" y="356" text-anchor="middle" font-weight="600">$650 in office</text>
    <text class="label-sub" x="600" y="380" text-anchor="middle">$2,250 at home</text>
  </g>
  <g>
    <circle cx="835" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-tank" x="811" y="158" width="48" height="48"/>
    <circle class="badge" cx="802" cy="148" r="15"/><text class="badge-num" x="802" y="154" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="262" text-anchor="middle">Store it</text>
    <text class="step-text" x="835" y="290" text-anchor="middle">Pay yearly or</text>
    <text class="step-text" x="835" y="312" text-anchor="middle">monthly</text>
    <rect x="743" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="835" y="356" text-anchor="middle" font-weight="600">$425 a year</text>
    <text class="label-sub" x="835" y="380" text-anchor="middle">or $50 a month</text>
  </g>
  <g>
    <circle cx="1070" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-thaw" x="1046" y="158" width="48" height="48"/>
    <circle class="badge" cx="1037" cy="148" r="15"/><text class="badge-num" x="1037" y="154" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="262" text-anchor="middle">Thaw and use it</text>
    <text class="step-text" x="1070" y="290" text-anchor="middle">For IUI or IVF, at</text>
    <text class="step-text" x="1070" y="312" text-anchor="middle">Aurea or elsewhere</text>
    <rect x="978" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="1070" y="370" text-anchor="middle">$250</text>
  </g>
  <rect class="card" x="40" y="418" width="1120" height="178" rx="22"/>
  <text class="step-title" x="72" y="456">The real 10-year total: $5,150</text>
  <rect x="72" y="474" width="133" height="44" rx="8" fill="#D3C8BB"/>
  <rect x="208" y="474" width="865" height="44" fill="#BDB5CA"/>
  <rect x="1076" y="474" width="52" height="44" rx="8" fill="#E5D9C8"/>
  <text class="label" x="86" y="502" font-weight="600">$650</text>
  <text class="label" x="223" y="502" font-weight="600">$4,250 storage (10 years × $425)</text>
  <path class="leader" d="M1102,520 L1102,530"/>
  <text class="label-sub" x="1128" y="550" text-anchor="end">$250 thaw</text>
  <path class="leader" d="M138,520 L138,530"/>
  <text class="label-sub" x="72" y="550">Freezing</text>
  <text class="note" x="72" y="582">Paying storage monthly instead adds $175 a year, making the 10-year total $6,900.</text>
</svg>
</body></html>
