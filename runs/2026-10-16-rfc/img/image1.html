<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">How the donor eggs procedure works</text>
  <text class="subtitle" x="40" y="96">A young donor's egg is fertilized in the lab, grows into an embryo, and is placed in your uterus.</text>

  <!-- cards -->
  <rect class="card" x="32" y="128" width="360" height="464" rx="22"/>
  <rect class="card" x="420" y="128" width="380" height="464" rx="22"/>
  <rect class="card" x="828" y="128" width="340" height="464" rx="22"/>

  <!-- step 1 -->
  <circle class="badge" cx="66" cy="167" r="17"/><text class="badge-num" x="66" y="173.5" text-anchor="middle">1</text>
  <text class="step-title" x="94" y="175">Egg from a young donor</text>
  <use href="#ovary-section" x="52" y="232" width="320" height="210"/>
  <path class="leader" d="M112,230 L120,262"/><circle class="leader-dot" cx="120" cy="262" r="4"/>
  <text class="label" x="56" y="222">Donor's ovary</text>
  <path class="leader" d="M104,452 L148,393"/><circle class="leader-dot" cx="148" cy="393" r="4"/>
  <text class="label" x="60" y="472">Follicles</text>
  <path class="leader" d="M275,452 L275,381"/><circle class="leader-dot" cx="275" cy="381" r="4"/>
  <text class="label" x="226" y="472">Mature egg</text>
  <text class="step-text" x="56" y="550">Fresh from a donor, or thawed</text>
  <text class="step-text" x="56" y="574">from a frozen egg bank</text>

  <!-- step 2 -->
  <circle class="badge" cx="454" cy="167" r="17"/><text class="badge-num" x="454" y="173.5" text-anchor="middle">2</text>
  <text class="step-title" x="482" y="175">Fertilized in the lab</text>
  <path d="M430,270 L500,270 C511,270 516,278 516,285 C516,292 511,300 500,300 L430,300 Z" fill="url(#g-glass)" stroke="#9FAAB0" stroke-width="1.4"/>
  <use href="#oocyte" x="498" y="223" width="124" height="124"/>
  <path d="M574,286 L640,280.5 L712,280.5 L712,291.5 L640,291.5 Z" fill="url(#g-glass)" stroke="#9FAAB0" stroke-width="1.2"/>
  <use href="#sperm" x="590" y="282.5" width="40" height="7.5"/>
  <path class="leader" d="M478,244 L520,258"/><circle class="leader-dot" cx="520" cy="258" r="4"/>
  <text class="label" x="440" y="240">Egg</text>
  <path class="leader" d="M664,262 L616,283"/><circle class="leader-dot" cx="616" cy="283" r="4"/>
  <text class="label" x="650" y="232">One sperm</text>
  <text class="label" x="650" y="255">injected (ICSI)</text>
  <path class="arrow-solid" d="M560,358 L560,382" marker-end="url(#m-arrow)"/>
  <use href="#blastocyst" x="500" y="392" width="120" height="120"/>
  <path class="leader" d="M636,452 L616,452"/><circle class="leader-dot" cx="616" cy="452" r="4"/>
  <text class="label" x="642" y="446">Embryo grows</text>
  <text class="label" x="642" y="469">for 3 to 5 days</text>
  <text class="step-text" x="444" y="550">Often done by ICSI, then the</text>
  <text class="step-text" x="444" y="574">embryo grows to transfer day</text>

  <!-- step 3 -->
  <circle class="badge" cx="862" cy="167" r="17"/><text class="badge-num" x="862" y="173.5" text-anchor="middle">3</text>
  <text class="step-title" x="890" y="175">Placed in your uterus</text>
  <use href="#uterus-body" x="843.3" y="205" width="153.5" height="300"/>
  <rect x="917" y="300" width="6" height="196" rx="3" fill="#F4F6F7" stroke="#A9B2B6" stroke-width="1.3"/>
  <rect x="913" y="486" width="14" height="34" rx="4" fill="#DDE3E6" stroke="#A9B2B6" stroke-width="1.3"/>
  <use href="#blastocyst" x="907" y="276" width="26" height="26"/>
  <path class="leader" d="M996,262 L963,280"/><circle class="leader-dot" cx="963" cy="280" r="4"/>
  <text class="label" x="1002" y="256">Lining</text>
  <text class="label-sub" x="1002" y="278">(endometrium)</text>
  <path class="leader" d="M996,318 L932,293"/><circle class="leader-dot" cx="932" cy="293" r="4"/>
  <text class="label" x="1002" y="324">Embryo</text>
  <path class="leader" d="M996,398 L946,405"/><circle class="leader-dot" cx="946" cy="405" r="4"/>
  <text class="label" x="1002" y="404">Cervix</text>
  <path class="leader" d="M996,462 L925,470"/><circle class="leader-dot" cx="925" cy="470" r="4"/>
  <text class="label" x="1002" y="468">Soft catheter</text>
  <text class="step-text" x="852" y="550">Your lining is prepared first</text>
  <text class="step-text" x="852" y="574">with estrogen, then progesterone</text>

  <!-- connectors -->
  <g>
    <circle cx="406" cy="360" r="16" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="1.5"/>
    <path d="M402,353 L409,360 L402,367" fill="none" stroke="#8C8279" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="814" cy="360" r="16" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="1.5"/>
    <path d="M810,353 L817,360 L810,367" fill="none" stroke="#8C8279" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
</body></html>
