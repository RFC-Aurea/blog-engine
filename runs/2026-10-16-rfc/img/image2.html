<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Donor egg treatment, step by step</text>
  <text class="subtitle" x="40" y="96">With frozen donor eggs, most of the time goes into testing, choosing a donor and preparing your lining.</text>

  <!-- timeline line -->
  <path d="M110,196 L1090,196" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>

  <!-- six steps, 196px apart -->
  <g>
    <circle cx="110" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="84" y="170" width="52" height="52"/>
    <circle class="badge" cx="76" cy="160" r="15"/><text class="badge-num" x="76" y="166" text-anchor="middle">1</text>
    <text class="step-title" x="110" y="282" text-anchor="middle">Consultation</text>
    <text class="step-title" x="110" y="307" text-anchor="middle">and testing</text>
    <text class="step-text" x="110" y="338" text-anchor="middle">Blood work,</text>
    <text class="step-text" x="110" y="361" text-anchor="middle">screening and a</text>
    <text class="step-text" x="110" y="384" text-anchor="middle">uterus check</text>
  </g>
  <g>
    <circle cx="306" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="280" y="170" width="52" height="52"/>
    <circle class="badge" cx="272" cy="160" r="15"/><text class="badge-num" x="272" y="166" text-anchor="middle">2</text>
    <text class="step-title" x="306" y="282" text-anchor="middle">Choose</text>
    <text class="step-title" x="306" y="307" text-anchor="middle">a donor</text>
    <text class="step-text" x="306" y="338" text-anchor="middle">Frozen egg bank</text>
    <text class="step-text" x="306" y="361" text-anchor="middle">or a fresh donor</text>
  </g>
  <g>
    <circle cx="502" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="476" y="170" width="52" height="52"/>
    <circle class="badge" cx="468" cy="160" r="15"/><text class="badge-num" x="468" y="166" text-anchor="middle">3</text>
    <text class="step-title" x="502" y="282" text-anchor="middle">Prepare</text>
    <text class="step-title" x="502" y="307" text-anchor="middle">your lining</text>
    <text class="step-text" x="502" y="338" text-anchor="middle">Estrogen, then</text>
    <text class="step-text" x="502" y="361" text-anchor="middle">progesterone, for</text>
    <text class="step-text" x="502" y="384" text-anchor="middle">a few weeks</text>
  </g>
  <g>
    <circle cx="698" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="672" y="170" width="52" height="52"/>
    <circle class="badge" cx="664" cy="160" r="15"/><text class="badge-num" x="664" y="166" text-anchor="middle">4</text>
    <text class="step-title" x="698" y="282" text-anchor="middle">Fertilize</text>
    <text class="step-title" x="698" y="307" text-anchor="middle">in the lab</text>
    <text class="step-text" x="698" y="338" text-anchor="middle">Eggs thawed and</text>
    <text class="step-text" x="698" y="361" text-anchor="middle">fertilized, often</text>
    <text class="step-text" x="698" y="384" text-anchor="middle">by ICSI</text>
  </g>
  <g>
    <circle cx="894" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-uterus" x="868" y="170" width="52" height="52"/>
    <circle class="badge" cx="860" cy="160" r="15"/><text class="badge-num" x="860" y="166" text-anchor="middle">5</text>
    <text class="step-title" x="894" y="282" text-anchor="middle">Embryo</text>
    <text class="step-title" x="894" y="307" text-anchor="middle">transfer</text>
    <text class="step-text" x="894" y="338" text-anchor="middle">3 to 5 days after</text>
    <text class="step-text" x="894" y="361" text-anchor="middle">fertilization, no</text>
    <text class="step-text" x="894" y="384" text-anchor="middle">anesthesia</text>
  </g>
  <g>
    <circle cx="1090" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="1064" y="170" width="52" height="52"/>
    <circle class="badge" cx="1056" cy="160" r="15"/><text class="badge-num" x="1056" y="166" text-anchor="middle">6</text>
    <text class="step-title" x="1090" y="282" text-anchor="middle">Pregnancy</text>
    <text class="step-title" x="1090" y="307" text-anchor="middle">blood test</text>
    <text class="step-text" x="1090" y="338" text-anchor="middle">Usually within</text>
    <text class="step-text" x="1090" y="361" text-anchor="middle">two weeks of</text>
    <text class="step-text" x="1090" y="384" text-anchor="middle">the transfer</text>
  </g>

  <!-- tests to ask for -->
  <rect class="card" x="40" y="420" width="1120" height="176" rx="22"/>
  <text class="step-title" x="72" y="462">Tests to ask for before transfer</text>
  <use href="#icon-check" x="72" y="486" width="26" height="26"/>
  <text class="label" x="110" y="506">Uterine cavity check (saline sonogram or hysteroscopy)</text>
  <use href="#icon-check" x="72" y="538" width="26" height="26"/>
  <text class="label" x="110" y="558">Thyroid, blood sugar and blood pressure</text>
  <use href="#icon-check" x="660" y="486" width="26" height="26"/>
  <text class="label" x="698" y="506">Chronic endometritis, after failed transfers</text>
  <use href="#icon-check" x="660" y="538" width="26" height="26"/>
  <text class="label" x="698" y="558">Immune testing, after repeated failure or loss</text>
</svg>
</body></html>
