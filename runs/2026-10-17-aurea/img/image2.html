<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">PGT-A testing at Aurea: timeline and cost</text>
  <text class="subtitle" x="40" y="96">Tested embryos are frozen while the lab works, so transfer happens in a later cycle.</text>
  <path d="M110,182 L1090,182" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="110" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-phone" x="86" y="158" width="48" height="48"/>
    <circle class="badge" cx="78" cy="150" r="15"/><text class="badge-num" x="78" y="156" text-anchor="middle">1</text>
    <text class="step-title" x="110" y="256" text-anchor="middle">Consult</text>
    <text class="step-text" x="110" y="284" text-anchor="middle">Nurse call, then</text>
    <text class="step-text" x="110" y="306" text-anchor="middle">a physician visit</text>
    <rect x="30" y="326" width="160" height="62" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="110" y="352" text-anchor="middle" font-weight="600">$350 consult</text>
    <text class="label-sub" x="110" y="375" text-anchor="middle">nurse call free</text>
  </g>
  <g>
    <circle cx="306" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="282" y="158" width="48" height="48"/>
    <circle class="badge" cx="274" cy="150" r="15"/><text class="badge-num" x="274" y="156" text-anchor="middle">2</text>
    <text class="step-title" x="306" y="256" text-anchor="middle">Retrieval</text>
    <text class="step-text" x="306" y="284" text-anchor="middle">About 2 weeks</text>
    <text class="step-text" x="306" y="306" text-anchor="middle">from first visit</text>
    <rect x="226" y="326" width="160" height="62" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="306" y="352" text-anchor="middle" font-weight="600">$6,950</text>
    <text class="label-sub" x="306" y="375" text-anchor="middle">IVF, freeze-all</text>
  </g>
  <g>
    <circle cx="502" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="478" y="158" width="48" height="48"/>
    <circle class="badge" cx="470" cy="150" r="15"/><text class="badge-num" x="470" y="156" text-anchor="middle">3</text>
    <text class="step-title" x="502" y="256" text-anchor="middle">Biopsy</text>
    <text class="step-text" x="502" y="284" text-anchor="middle">Days 5 to 7,</text>
    <text class="step-text" x="502" y="306" text-anchor="middle">then frozen</text>
    <rect x="422" y="326" width="160" height="62" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="502" y="352" text-anchor="middle" font-weight="600">$950</text>
    <text class="label-sub" x="502" y="375" text-anchor="middle">per embryo</text>
  </g>
  <g>
    <circle cx="698" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="674" y="158" width="48" height="48"/>
    <circle class="badge" cx="666" cy="150" r="15"/><text class="badge-num" x="666" y="156" text-anchor="middle">4</text>
    <text class="step-title" x="698" y="256" text-anchor="middle">Results</text>
    <text class="step-text" x="698" y="284" text-anchor="middle">Usually within</text>
    <text class="step-text" x="698" y="306" text-anchor="middle">a couple of weeks</text>
  </g>
  <g>
    <circle cx="894" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="870" y="158" width="48" height="48"/>
    <circle class="badge" cx="862" cy="150" r="15"/><text class="badge-num" x="862" y="156" text-anchor="middle">5</text>
    <text class="step-title" x="894" y="256" text-anchor="middle">Review</text>
    <text class="step-text" x="894" y="284" text-anchor="middle">Euploid, mosaic</text>
    <text class="step-text" x="894" y="306" text-anchor="middle">or no result</text>
  </g>
  <g>
    <circle cx="1090" cy="182" r="40" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-uterus" x="1066" y="158" width="48" height="48"/>
    <circle class="badge" cx="1058" cy="150" r="15"/><text class="badge-num" x="1058" y="156" text-anchor="middle">6</text>
    <text class="step-title" x="1090" y="256" text-anchor="middle">Transfer</text>
    <text class="step-text" x="1090" y="284" text-anchor="middle">One euploid</text>
    <text class="step-text" x="1090" y="306" text-anchor="middle">embryo, frozen</text>
    <rect x="1010" y="326" width="160" height="62" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="1090" y="352" text-anchor="middle" font-weight="600">$4,750</text>
    <text class="label-sub" x="1090" y="375" text-anchor="middle">per transfer</text>
  </g>

  <rect class="card" x="32" y="424" width="1136" height="168" rx="22"/>
  <text class="step-title" x="64" y="466">Example: one cycle with 4 embryos tested</text>
  <rect x="64" y="490" width="486" height="40" rx="8" fill="#D3C8BB"/>
  <text class="label" x="80" y="517">IVF, freeze-all $6,950</text>
  <rect x="550" y="490" width="265" height="40" rx="8" fill="#B9B1C7"/>
  <text class="label" x="566" y="517">PGT-A $3,800</text>
  <rect x="815" y="490" width="333" height="40" rx="8" fill="#E9DCC8"/>
  <text class="label" x="831" y="517">Transfer $4,750</text>
  <text class="label" x="64" y="568" font-weight="600">Total $15,500 before medications</text>
  <text class="note" x="1148" y="568" text-anchor="end">Prices as of October 2026; they can change</text>
</svg>
</body></html>
