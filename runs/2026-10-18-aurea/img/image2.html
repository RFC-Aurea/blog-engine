<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">After the HSG test: what happens next</text>
  <text class="subtitle" x="40" y="96">Your doctor reviews the images the same day. Each result points to a clear next step.</text>

  <rect class="card" x="40" y="128" width="268" height="282" rx="20"/>
  <circle class="badge" cx="74" cy="164" r="16"/><text class="badge-num" x="74" y="170" text-anchor="middle">1</text>
  <text class="step-title" x="100" y="171">Both tubes open</text>
  <text class="step-text" x="64" y="214">Tubes are not the</text>
  <text class="step-text" x="64" y="238">barrier. Next: timed</text>
  <text class="step-text" x="64" y="262">intercourse or IUI</text>
  <text class="big-number" x="64" y="370">$800</text>
  <text class="label-sub" x="64" y="394">IUI at Aurea</text>

  <rect class="card" x="320" y="128" width="268" height="282" rx="20"/>
  <circle class="badge" cx="354" cy="164" r="16"/><text class="badge-num" x="354" y="170" text-anchor="middle">2</text>
  <text class="step-title" x="380" y="171">One tube open</text>
  <text class="step-text" x="344" y="214">Pregnancy is still</text>
  <text class="step-text" x="344" y="238">possible. IUI on the</text>
  <text class="step-text" x="344" y="262">open side is a</text>
  <text class="step-text" x="344" y="286">common next step</text>

  <rect class="card" x="600" y="128" width="268" height="282" rx="20"/>
  <circle class="badge" cx="634" cy="164" r="16"/><text class="badge-num" x="634" y="170" text-anchor="middle">3</text>
  <text class="step-title" x="660" y="171">Both look blocked</text>
  <text class="step-text" x="624" y="214">Confirm with a</text>
  <text class="step-text" x="624" y="238">second test first,</text>
  <text class="step-text" x="624" y="262">then consider tubal</text>
  <text class="step-text" x="624" y="286">recanalization</text>
  <text class="big-number" x="624" y="370">$3,800</text>
  <text class="label-sub" x="624" y="394">recanalization at Aurea</text>

  <rect class="card" x="880" y="128" width="280" height="282" rx="20"/>
  <circle class="badge" cx="914" cy="164" r="16"/><text class="badge-num" x="914" y="170" text-anchor="middle">4</text>
  <text class="step-title" x="940" y="171">Truly blocked</text>
  <text class="step-text" x="904" y="214">Or a fluid-filled tube</text>
  <text class="step-text" x="904" y="238">(hydrosalpinx): IVF</text>
  <text class="step-text" x="904" y="262">bypasses the tubes</text>
  <text class="step-text" x="904" y="286">completely</text>

  <rect x="40" y="430" width="1120" height="172" rx="20" fill="#E4E0EA"/>
  <text class="step-title" x="72" y="472">Tube checks and visits at Aurea (2026 prices)</text>
  <use href="#icon-check" x="72" y="496" width="26" height="26"/>
  <text class="label" x="110" y="516">SIS/HyCoSy ultrasound tube check: $350</text>
  <use href="#icon-check" x="72" y="544" width="26" height="26"/>
  <text class="label" x="110" y="564">Physician consult: $350, or a free 20-minute nurse call</text>
  <use href="#icon-check" x="660" y="496" width="26" height="26"/>
  <text class="label" x="698" y="516">Hysteroscopy: $3,400</text>
  <text class="note" x="660" y="564">Prices can change; your consult confirms the plan.</text>
</svg>
</body></html>
