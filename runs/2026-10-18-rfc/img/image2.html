<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Pregnancy at 45: find your path</text>
  <text class="subtitle" x="40" y="96">Test first. Your results, not your age alone, point to the plan that fits.</text>

  <!-- testing bar -->
  <rect class="card" x="40" y="122" width="1120" height="92" rx="20"/>
  <use href="#icon-clipboard" x="64" y="142" width="52" height="52"/>
  <text class="step-title" x="132" y="160">Step 1: one round of testing</text>
  <text class="step-text" x="132" y="190">AMH, day 2 to 3 FSH, antral follicle count, thyroid, prolactin, uterine check</text>

  <!-- arrows down -->
  <path class="arrow-solid" d="M180,218 L180,250"/><path class="arrow-head" d="M172,248 L188,248 L180,260 Z"/>
  <path class="arrow-solid" d="M460,218 L460,250"/><path class="arrow-head" d="M452,248 L468,248 L460,260 Z"/>
  <path class="arrow-solid" d="M740,218 L740,250"/><path class="arrow-head" d="M732,248 L748,248 L740,260 Z"/>
  <path class="arrow-solid" d="M1020,218 L1020,250"/><path class="arrow-head" d="M1012,248 L1028,248 L1020,260 Z"/>

  <!-- four scenario cards, 264 wide, 16 gap -->
  <rect class="card" x="40" y="266" width="268" height="250" rx="20"/>
  <circle class="badge" cx="74" cy="300" r="16"/><text class="badge-num" x="74" y="306" text-anchor="middle">A</text>
  <text class="step-title" x="100" y="307">Natural trial</text>
  <text class="label-sub" x="64" y="346">If: regular cycles,</text>
  <text class="label-sub" x="64" y="368">reserve normal for age</text>
  <text class="step-text" x="64" y="410">Time ovulation</text>
  <text class="step-text" x="64" y="434">for about 3 cycles,</text>
  <text class="step-text" x="64" y="458">then move on if</text>
  <text class="step-text" x="64" y="482">not pregnant</text>

  <rect class="card" x="320" y="266" width="268" height="250" rx="20"/>
  <circle class="badge" cx="354" cy="300" r="16"/><text class="badge-num" x="354" y="306" text-anchor="middle">B</text>
  <text class="step-title" x="380" y="307">Your own eggs</text>
  <text class="label-sub" x="344" y="346">If: low AMH, high FSH</text>
  <text class="label-sub" x="344" y="368">or few follicles</text>
  <text class="step-text" x="344" y="410">Gentle or natural IVF,</text>
  <text class="step-text" x="344" y="434">embryo banking,</text>
  <text class="step-text" x="344" y="458">ovarian rejuvenation</text>

  <rect class="card" x="600" y="266" width="268" height="250" rx="20"/>
  <circle class="badge" cx="634" cy="300" r="16"/><text class="badge-num" x="634" y="306" text-anchor="middle">C</text>
  <text class="step-title" x="660" y="307">After losses</text>
  <text class="label-sub" x="624" y="346">If: failed transfers or</text>
  <text class="label-sub" x="624" y="368">repeated miscarriage</text>
  <text class="step-text" x="624" y="410">Immunology workup,</text>
  <text class="step-text" x="624" y="434">lining check,</text>
  <text class="step-text" x="624" y="458">embryo testing</text>

  <rect class="card" x="880" y="266" width="280" height="250" rx="20"/>
  <circle class="badge" cx="914" cy="300" r="16"/><text class="badge-num" x="914" y="306" text-anchor="middle">D</text>
  <text class="step-title" x="940" y="307">Donor eggs</text>
  <text class="label-sub" x="904" y="346">If: very low reserve, or</text>
  <text class="label-sub" x="904" y="368">you want the best odds</text>
  <text class="step-text" x="904" y="410">Recipient age was not</text>
  <text class="step-text" x="904" y="434">linked to the chance</text>
  <text class="step-text" x="904" y="458">of a healthy baby</text>

  <!-- pregnancy care bar -->
  <rect x="40" y="532" width="1120" height="70" rx="20" fill="#DCE4D6"/>
  <use href="#icon-check" x="64" y="553" width="28" height="28"/>
  <text class="label" x="104" y="574">Then: early high-risk prenatal care, blood pressure checks and early glucose testing</text>
</svg>
</body></html>
