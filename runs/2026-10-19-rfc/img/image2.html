<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">After a POI diagnosis: five steps forward</text>
  <text class="subtitle" x="40" y="96">Testing first, then a path matched to what your ovaries are doing.</text>

  <path d="M130,196 L1070,196" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="104" y="170" width="52" height="52"/>
    <circle class="badge" cx="96" cy="160" r="15"/><text class="badge-num" x="96" y="166" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="282" text-anchor="middle">Confirm the</text>
    <text class="step-title" x="130" y="307" text-anchor="middle">diagnosis</text>
    <text class="step-text" x="130" y="338" text-anchor="middle">FSH above 25 IU/L,</text>
    <text class="step-text" x="130" y="361" text-anchor="middle">repeated if unclear</text>
  </g>
  <g>
    <circle cx="365" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="339" y="170" width="52" height="52"/>
    <circle class="badge" cx="331" cy="160" r="15"/><text class="badge-num" x="331" y="166" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="282" text-anchor="middle">Look for</text>
    <text class="step-title" x="365" y="307" text-anchor="middle">a cause</text>
    <text class="step-text" x="365" y="338" text-anchor="middle">Karyotype, Fragile X,</text>
    <text class="step-text" x="365" y="361" text-anchor="middle">thyroid and</text>
    <text class="step-text" x="365" y="384" text-anchor="middle">immune tests</text>
  </g>
  <g>
    <circle cx="600" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="574" y="170" width="52" height="52"/>
    <circle class="badge" cx="566" cy="160" r="15"/><text class="badge-num" x="566" y="166" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="282" text-anchor="middle">Protect</text>
    <text class="step-title" x="600" y="307" text-anchor="middle">your health</text>
    <text class="step-text" x="600" y="338" text-anchor="middle">Hormone therapy</text>
    <text class="step-text" x="600" y="361" text-anchor="middle">and a bone check</text>
  </g>
  <g>
    <circle cx="835" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="809" y="170" width="52" height="52"/>
    <circle class="badge" cx="801" cy="160" r="15"/><text class="badge-num" x="801" y="166" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="282" text-anchor="middle">Check for</text>
    <text class="step-title" x="835" y="307" text-anchor="middle">ovarian activity</text>
    <text class="step-text" x="835" y="338" text-anchor="middle">Repeat bloodwork</text>
    <text class="step-text" x="835" y="361" text-anchor="middle">and ultrasounds</text>
    <text class="step-text" x="835" y="384" text-anchor="middle">over several weeks</text>
  </g>
  <g>
    <circle cx="1070" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="1044" y="170" width="52" height="52"/>
    <circle class="badge" cx="1036" cy="160" r="15"/><text class="badge-num" x="1036" y="166" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="282" text-anchor="middle">Choose</text>
    <text class="step-title" x="1070" y="307" text-anchor="middle">your path</text>
    <text class="step-text" x="1070" y="338" text-anchor="middle">Based on what</text>
    <text class="step-text" x="1070" y="361" text-anchor="middle">your ovaries</text>
    <text class="step-text" x="1070" y="384" text-anchor="middle">are doing now</text>
  </g>

  <rect class="card" x="40" y="420" width="1120" height="176" rx="22"/>
  <text class="step-title" x="72" y="462">Paths to pregnancy with POI</text>
  <use href="#icon-check" x="72" y="486" width="26" height="26"/>
  <text class="label" x="110" y="506">Follicle appears: timed cycle, IUI or natural IVF</text>
  <use href="#icon-check" x="72" y="538" width="26" height="26"/>
  <text class="label" x="110" y="558">Ovarian rejuvenation (PRP or adipose-PRP)</text>
  <use href="#icon-check" x="660" y="486" width="26" height="26"/>
  <text class="label" x="698" y="506">Donor eggs, the most reliable path</text>
  <use href="#icon-check" x="660" y="538" width="26" height="26"/>
  <text class="label" x="698" y="558">Own eggs first, then donor eggs</text>
</svg>
</body></html>
