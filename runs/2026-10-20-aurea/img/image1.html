<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">How conception happens each cycle</text>
  <text class="subtitle" x="40" y="96">One egg, a short window, and sperm that can wait a few days. That is why timing matters most.</text>

  <rect class="card" x="32" y="128" width="620" height="464" rx="22"/>
  <rect class="card" x="680" y="128" width="488" height="464" rx="22"/>

  <!-- left: anatomy -->
  <use href="#uterus" x="64" y="190" width="399.5" height="365.5"/>
  <!-- egg in right tube, meeting sperm -->
  <use href="#oocyte" x="377" y="210" width="28" height="28"/>
  <use href="#sperm" x="0" y="0" width="44" height="8.2" transform="translate(379,227) rotate(167)"/>
  <!-- sperm moving up through cervix and uterus (head first) -->
  <use href="#sperm" x="0" y="0" width="56" height="10.4" transform="translate(264,404) rotate(90)"/>
  <use href="#sperm" x="0" y="0" width="56" height="10.4" transform="translate(286,318) rotate(110)"/>
  <use href="#sperm" x="0" y="0" width="56" height="10.4" transform="translate(240,300) rotate(70)"/>

  <path class="leader" d="M476,184 L404,216"/><circle class="leader-dot" cx="404" cy="216" r="4"/>
  <text class="label" x="482" y="180">Egg meets sperm</text>
  <text class="label-sub" x="482" y="202" dy="-2">in the fallopian tube</text>

  <path class="leader" d="M476,318 L436,322"/><circle class="leader-dot" cx="436" cy="322" r="4"/>
  <text class="label" x="482" y="314">Ovary releases</text>
  <text class="label-sub" x="482" y="336" dy="-2">one egg (ovulation)</text>

  <path class="leader" d="M476,436 L306,264"/><circle class="leader-dot" cx="306" cy="264" r="4"/>
  <text class="label" x="482" y="432">Embryo implants</text>
  <text class="label-sub" x="482" y="454" dy="-2">in the lining</text>

  <path class="leader" d="M476,530 L272,420"/><circle class="leader-dot" cx="272" cy="420" r="4"/>
  <text class="label" x="482" y="526">Sperm swim up</text>
  <text class="label-sub" x="482" y="548" dy="-2">through the cervix</text>

  <!-- right: fertile window -->
  <text class="step-title" x="712" y="172">The fertile window</text>
  <text class="label-sub" x="712" y="198">Sex can lead to pregnancy only on these days</text>
  <g>
    <rect x="712" y="232" width="52" height="52" rx="10" fill="#E4E0EA" stroke="#B4ADC2" stroke-width="1.5"/>
    <rect x="772" y="232" width="52" height="52" rx="10" fill="#E4E0EA" stroke="#B4ADC2" stroke-width="1.5"/>
    <rect x="832" y="232" width="52" height="52" rx="10" fill="#E4E0EA" stroke="#B4ADC2" stroke-width="1.5"/>
    <rect x="892" y="232" width="52" height="52" rx="10" fill="#C8C1D3" stroke="#B4ADC2" stroke-width="1.5"/>
    <rect x="952" y="232" width="52" height="52" rx="10" fill="#C8C1D3" stroke="#B4ADC2" stroke-width="1.5"/>
    <rect x="1012" y="232" width="52" height="52" rx="10" fill="#B4ADC2" stroke="#9E97AE" stroke-width="1.5"/>
    <rect x="1072" y="232" width="52" height="52" rx="10" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
  </g>
  <path d="M712,222 L712,214 L1064,214 L1064,222" fill="none" stroke="#9C9186" stroke-width="2"/>
  
  <text class="label" x="1038" y="312" text-anchor="middle" font-weight="600">Ovulation</text>
  <text class="label-sub" x="712" y="312">6 days</text>

  <path class="card-line" d="M712,340 L1136,340"/>
  <text class="big-number" x="712" y="394">33%</text>
  <text class="label" x="830" y="382">chance of pregnancy with</text>
  <text class="label" x="830" y="406">sex on ovulation day</text>
  <text class="note" x="712" y="436">221 women, New England Journal of Medicine, 1995</text>

  <path class="card-line" d="M712,462 L1136,462"/>
  <text class="step-title" x="712" y="500">Best odds</text>
  <text class="label" x="712" y="532">Sex every 1 to 2 days in the window</text>
  <text class="note" x="712" y="566">Source: ASRM committee opinion</text>
</svg>
</body></html>
