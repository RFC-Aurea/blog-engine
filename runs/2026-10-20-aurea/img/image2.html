<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Trying to conceive: a month-by-month plan</text>
  <text class="subtitle" x="40" y="96">Most couples under 40 conceive within a year. Here is when to keep trying and when to test.</text>
  <path d="M130,182 L1070,182" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="106" y="158" width="48" height="48"/>
    <circle class="badge" cx="97" cy="148" r="15"/><text class="badge-num" x="97" y="154" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="262" text-anchor="middle">Before you start</text>
    <text class="step-text" x="130" y="292" text-anchor="middle">Folic acid 400 mcg</text>
    <text class="step-text" x="130" y="316" text-anchor="middle">daily, at least</text>
    <text class="step-text" x="130" y="340" text-anchor="middle">1 month ahead</text>
  </g>
  <g>
    <circle cx="365" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="341" y="158" width="48" height="48"/>
    <circle class="badge" cx="332" cy="148" r="15"/><text class="badge-num" x="332" y="154" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="262" text-anchor="middle">Months 1 to 3</text>
    <text class="step-text" x="365" y="292" text-anchor="middle">Highest monthly odds.</text>
    <text class="step-text" x="365" y="316" text-anchor="middle">Sex every 1 to 2</text>
    <text class="step-text" x="365" y="340" text-anchor="middle">days in the window</text>
  </g>
  <g>
    <circle cx="600" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-check" x="576" y="158" width="48" height="48"/>
    <circle class="badge" cx="567" cy="148" r="15"/><text class="badge-num" x="567" y="154" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="262" text-anchor="middle">Month 6</text>
    <text class="step-text" x="600" y="292" text-anchor="middle">About 80% have</text>
    <text class="step-text" x="600" y="316" text-anchor="middle">conceived. 35 or</text>
    <text class="step-text" x="600" y="340" text-anchor="middle">older: get evaluated</text>
  </g>
  <g>
    <circle cx="835" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="811" y="158" width="48" height="48"/>
    <circle class="badge" cx="802" cy="148" r="15"/><text class="badge-num" x="802" y="154" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="262" text-anchor="middle">Month 12</text>
    <text class="step-text" x="835" y="292" text-anchor="middle">Under 35: get</text>
    <text class="step-text" x="835" y="316" text-anchor="middle">evaluated. 82% to 92%</text>
    <text class="step-text" x="835" y="340" text-anchor="middle">pregnant by 1 year</text>
  </g>
  <g>
    <circle cx="1070" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="1046" y="158" width="48" height="48"/>
    <circle class="badge" cx="1037" cy="148" r="15"/><text class="badge-num" x="1037" y="154" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="262" text-anchor="middle">Tests and consult</text>
    <text class="step-text" x="1070" y="292" text-anchor="middle">Semen analysis $300</text>
    <text class="step-text" x="1070" y="316" text-anchor="middle">SIS/HyCoSy $350</text>
    <text class="step-text" x="1070" y="340" text-anchor="middle">Physician consult $350</text>
  </g>
  <rect class="card" x="40" y="410" width="1120" height="186" rx="22"/>
  <text class="step-title" x="72" y="450">Go sooner, without waiting for a deadline, if you have:</text>
  <text class="label" x="72" y="492">Very irregular or absent periods</text>
  <text class="label" x="72" y="526">Known endometriosis or PCOS</text>
  <text class="label" x="72" y="560">Past pelvic infection or surgery</text>
  <text class="label" x="620" y="492">A known sperm problem</text>
  <text class="label" x="620" y="526">Two or more pregnancy losses</text>
  <text class="label" x="620" y="560">Age 40 or older, or low ovarian reserve</text>
</svg>
</body></html>
