<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Timing egg retrieval after ovarian PRP</text>
  <text class="subtitle" x="40" y="96">Resting follicles need time to grow, so the retrieval date matters.</text>
  <path d="M130,196 L1070,196" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="104" y="170" width="52" height="52"/>
    <circle class="badge" cx="96" cy="160" r="15"/><text class="badge-num" x="96" y="166" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="282" text-anchor="middle">Baseline</text>
    <text class="step-title" x="130" y="307" text-anchor="middle">tests</text>
    <text class="step-text" x="130" y="338" text-anchor="middle">AMH, FSH and</text>
    <text class="step-text" x="130" y="361" text-anchor="middle">follicle count</text>
  </g>
  <g>
    <circle cx="365" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="339" y="170" width="52" height="52"/>
    <circle class="badge" cx="331" cy="160" r="15"/><text class="badge-num" x="331" y="166" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="282" text-anchor="middle">Treatment</text>
    <text class="step-title" x="365" y="307" text-anchor="middle">day</text>
    <text class="step-text" x="365" y="338" text-anchor="middle">PRP or</text>
    <text class="step-text" x="365" y="361" text-anchor="middle">adipose-PRP</text>
  </g>
  <g>
    <circle cx="600" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="574" y="170" width="52" height="52"/>
    <circle class="badge" cx="566" cy="160" r="15"/><text class="badge-num" x="566" y="166" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="282" text-anchor="middle">Day 24</text>
    <text class="step-text" x="600" y="313" text-anchor="middle">No clear gain</text>
    <text class="step-text" x="600" y="336" text-anchor="middle">in eggs yet</text>
    <text class="step-text" x="600" y="359" text-anchor="middle">in one trial</text>
  </g>
  <g>
    <circle cx="835" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="809" y="170" width="52" height="52"/>
    <circle class="badge" cx="801" cy="160" r="15"/><text class="badge-num" x="801" y="166" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="282" text-anchor="middle">Day 49</text>
    <text class="step-text" x="835" y="313" text-anchor="middle">More mature eggs</text>
    <text class="step-text" x="835" y="336" text-anchor="middle">than placebo</text>
    <text class="step-text" x="835" y="359" text-anchor="middle">in the same trial</text>
  </g>
  <g>
    <circle cx="1070" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="1044" y="170" width="52" height="52"/>
    <circle class="badge" cx="1036" cy="160" r="15"/><text class="badge-num" x="1036" y="166" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="282" text-anchor="middle">Months 3 to 6</text>
    <text class="step-text" x="1070" y="313" text-anchor="middle">Retest AMH and</text>
    <text class="step-text" x="1070" y="336" text-anchor="middle">follicle count,</text>
    <text class="step-text" x="1070" y="359" text-anchor="middle">keep cycles going</text>
  </g>

  <rect class="card" x="40" y="420" width="1120" height="176" rx="22"/>
  <text class="step-title" x="72" y="462">Questions to ask your doctor</text>
  <use href="#icon-check" x="72" y="486" width="26" height="26"/>
  <text class="label" x="110" y="506">Which treatment fits my AMH and age?</text>
  <use href="#icon-check" x="72" y="538" width="26" height="26"/>
  <text class="label" x="110" y="558">How many weeks until my first retrieval?</text>
  <use href="#icon-check" x="620" y="486" width="26" height="26"/>
  <text class="label" x="658" y="506">Will you watch for follicles growing on their own?</text>
  <use href="#icon-check" x="620" y="538" width="26" height="26"/>
  <text class="label" x="658" y="558">What is the plan if my numbers do not change?</text>
</svg>
</body></html>
