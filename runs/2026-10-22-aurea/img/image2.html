<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">From first visit to egg retrieval recovery</text>
  <text class="subtitle" x="40" y="96">At Aurea the path from first visit to retrieval is typically about 2 weeks.</text>
  <path d="M130,182 L1070,182" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="106" y="158" width="48" height="48"/>
    <circle class="badge" cx="97" cy="148" r="15"/><text class="badge-num" x="97" y="154" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="262" text-anchor="middle">First visit</text>
    <text class="step-text" x="130" y="290" text-anchor="middle">Ultrasound and</text>
    <text class="step-text" x="130" y="312" text-anchor="middle">blood tests</text>
    <rect x="38" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="130" y="370" text-anchor="middle">Plan set</text>
  </g>
  <g>
    <circle cx="365" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="341" y="158" width="48" height="48"/>
    <circle class="badge" cx="332" cy="148" r="15"/><text class="badge-num" x="332" y="154" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="262" text-anchor="middle">Stimulation</text>
    <text class="step-text" x="365" y="290" text-anchor="middle">Daily injections</text>
    <text class="step-text" x="365" y="312" text-anchor="middle">and monitoring scans</text>
    <rect x="273" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="365" y="370" text-anchor="middle">8 to 12 days</text>
  </g>
  <g>
    <circle cx="600" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="576" y="158" width="48" height="48"/>
    <circle class="badge" cx="567" cy="148" r="15"/><text class="badge-num" x="567" y="154" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="262" text-anchor="middle">Trigger shot</text>
    <text class="step-text" x="600" y="290" text-anchor="middle">Times the final</text>
    <text class="step-text" x="600" y="312" text-anchor="middle">egg maturation</text>
    <rect x="508" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="600" y="356" text-anchor="middle" font-weight="600">34 to 36 hours</text>
    <text class="label-sub" x="600" y="380" text-anchor="middle">before retrieval</text>
  </g>
  <g>
    <circle cx="835" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="811" y="158" width="48" height="48"/>
    <circle class="badge" cx="802" cy="148" r="15"/><text class="badge-num" x="802" y="154" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="262" text-anchor="middle">Retrieval day</text>
    <text class="step-text" x="835" y="290" text-anchor="middle">Sedation, then the</text>
    <text class="step-text" x="835" y="312" text-anchor="middle">needle collects eggs</text>
    <rect x="743" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="835" y="356" text-anchor="middle" font-weight="600">10 to 30 minutes</text>
    <text class="label-sub" x="835" y="380" text-anchor="middle">in the room</text>
  </g>
  <g>
    <circle cx="1070" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-check" x="1046" y="158" width="48" height="48"/>
    <circle class="badge" cx="1037" cy="148" r="15"/><text class="badge-num" x="1037" y="154" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="262" text-anchor="middle">Recovery</text>
    <text class="step-text" x="1070" y="290" text-anchor="middle">Rest, mild cramps</text>
    <text class="step-text" x="1070" y="312" text-anchor="middle">and bloating</text>
    <rect x="978" y="330" width="184" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="1070" y="370" text-anchor="middle">1 to 2 days</text>
  </g>
  <rect class="card" x="40" y="418" width="1120" height="178" rx="22"/>
  <text class="step-title" x="72" y="456">Aurea prices as of 2026</text>
  <rect x="72" y="476" width="336" height="76" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
  <text class="label-sub" x="92" y="506">Egg freezing cycle</text>
  <text class="big-number" x="92" y="544" style="font-size:30px">$5,400</text>
  <rect x="432" y="476" width="336" height="76" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
  <text class="label-sub" x="452" y="506">IVF freeze-all</text>
  <text class="big-number" x="452" y="544" style="font-size:30px">$6,950</text>
  <rect x="792" y="476" width="336" height="76" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
  <text class="label-sub" x="812" y="506">IV sedation (separate fee)</text>
  <text class="big-number" x="812" y="544" style="font-size:30px">$750</text>
  <text class="note" x="72" y="580">Medications are not included. Prices can change, and your consult confirms your plan.</text>
</svg>
</body></html>
