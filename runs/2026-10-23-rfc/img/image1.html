<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Where recurrent miscarriage specialists look</text>
  <text class="subtitle" x="40" y="96">The embryo, the uterus, the blood, the hormones and both partners, checked in a set order.</text>

  <rect class="card" x="32" y="128" width="620" height="464" rx="22"/>
  <rect class="card" x="680" y="128" width="488" height="464" rx="22"/>

  <!-- left: anatomy -->
  <use href="#uterus" x="190" y="225" width="300" height="274.5"/>
  <use href="#blastocyst" x="327" y="285" width="26" height="26"/>

  <path class="leader" d="M340,196 L340,258"/><circle class="leader-dot" cx="340" cy="258" r="4"/>
  <text class="label" x="240" y="166">Uterine lining</text>
  <text class="label-sub" x="240" y="188">chronic endometritis</text>

  <path class="leader" d="M498,396 L350,302"/><circle class="leader-dot" cx="350" cy="302" r="4"/>
  <text class="label" x="504" y="400">Embryo</text>
  <text class="label-sub" x="504" y="422">chromosomes</text>

  <path class="leader" d="M500,282 L456,322"/><circle class="leader-dot" cx="456" cy="322" r="4"/>
  <text class="label" x="504" y="270">Ovary</text>
  <text class="label-sub" x="504" y="292">egg quality</text>

  <path class="leader" d="M180,392 L334,350"/><circle class="leader-dot" cx="334" cy="350" r="4"/>
  <text class="label" x="48" y="380">Uterine cavity</text>
  <text class="label-sub" x="48" y="402">septum, polyps,</text>
  <text class="label-sub" x="48" y="424">fibroids</text>

  <!-- bottom row: blood and partner checks -->
  <use href="#icon-drop" x="48" y="540" width="36" height="36"/>
  <text class="label" x="90" y="566">Clotting antibodies</text>
  <use href="#icon-vial" x="285" y="540" width="36" height="36"/>
  <text class="label" x="327" y="566">Thyroid (TSH)</text>
  <use href="#sperm" x="466" y="553" width="56" height="10.4"/>
  <text class="label" x="530" y="566">Sperm DNA</text>

  <!-- right: data -->
  <text class="step-title" x="712" y="172">What the evidence says</text>

  <text class="big-number" x="712" y="256">50–60%</text>
  <text class="label" x="880" y="232">of early miscarriages</text>
  <text class="label" x="880" y="256">come from embryo</text>
  <text class="label" x="880" y="280">chromosome errors</text>

  <path class="card-line" d="M712,316 L1136,316"/>
  <text class="big-number" x="712" y="392">50–80%</text>
  <text class="label" x="880" y="368">succeed in the next</text>
  <text class="label" x="880" y="392">pregnancy, even when</text>
  <text class="label" x="880" y="416">no cause is found</text>

  <path class="card-line" d="M712,456 L1136,456"/>
  <text class="step-title" x="712" y="496">Recurrent pregnancy loss</text>
  <text class="label" x="712" y="528">Two or more losses</text>
  <text class="note" x="712" y="566">Source: ASRM committee opinion, 2026</text>
</svg>
</body></html>
