<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">After a sperm DNA fragmentation test: the next steps</text>
  <text class="subtitle" x="40" y="96">A high result is the start of a plan. Most men have something they can change.</text>
  <path d="M130,182 L1070,182" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="130" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="106" y="158" width="48" height="48"/>
    <circle class="badge" cx="97" cy="148" r="15"/><text class="badge-num" x="97" y="154" text-anchor="middle">1</text>
    <text class="step-title" x="130" y="262" text-anchor="middle">Semen analysis</text>
    <text class="step-text" x="130" y="290" text-anchor="middle">Count, movement</text>
    <text class="step-text" x="130" y="312" text-anchor="middle">and shape</text>
    <rect x="34" y="330" width="192" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="130" y="370" text-anchor="middle">$300</text>
  </g>
  <g>
    <circle cx="365" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-vial" x="341" y="158" width="48" height="48"/>
    <circle class="badge" cx="332" cy="148" r="15"/><text class="badge-num" x="332" y="154" text-anchor="middle">2</text>
    <text class="step-title" x="365" y="262" text-anchor="middle">DNA fragmentation</text>
    <text class="step-text" x="365" y="290" text-anchor="middle">Only when your</text>
    <text class="step-text" x="365" y="312" text-anchor="middle">history points to it</text>
    <rect x="269" y="330" width="192" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="365" y="370" text-anchor="middle">$550</text>
  </g>
  <g>
    <circle cx="600" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-check" x="576" y="158" width="48" height="48"/>
    <circle class="badge" cx="567" cy="148" r="15"/><text class="badge-num" x="567" y="154" text-anchor="middle">3</text>
    <text class="step-title" x="600" y="262" text-anchor="middle">Treat the cause</text>
    <text class="step-text" x="600" y="290" text-anchor="middle">Varicocele, infection,</text>
    <text class="step-text" x="600" y="312" text-anchor="middle">smoking, weight</text>
    <rect x="504" y="330" width="192" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="600" y="356" text-anchor="middle" font-weight="600">20% to 40% fall</text>
    <text class="label-sub" x="600" y="380" text-anchor="middle">in fragmentation</text>
  </g>
  <g>
    <circle cx="835" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="811" y="158" width="48" height="48"/>
    <circle class="badge" cx="802" cy="148" r="15"/><text class="badge-num" x="802" y="154" text-anchor="middle">4</text>
    <text class="step-title" x="835" y="262" text-anchor="middle">Retest</text>
    <text class="step-text" x="835" y="290" text-anchor="middle">New sperm take one</text>
    <text class="step-text" x="835" y="312" text-anchor="middle">full cycle to mature</text>
    <rect x="739" y="330" width="192" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="step-title" x="835" y="370" text-anchor="middle">10 to 12 weeks</text>
  </g>
  <g>
    <circle cx="1070" cy="182" r="42" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="1046" y="158" width="48" height="48"/>
    <circle class="badge" cx="1037" cy="148" r="15"/><text class="badge-num" x="1037" y="154" text-anchor="middle">5</text>
    <text class="step-title" x="1070" y="262" text-anchor="middle">Choose treatment</text>
    <text class="step-text" x="1070" y="290" text-anchor="middle">IUI or IVF if normal,</text>
    <text class="step-text" x="1070" y="312" text-anchor="middle">ICSI if still high</text>
    <rect x="974" y="330" width="192" height="64" rx="14" fill="#FFFFFF" stroke="#D9CFC2" stroke-width="1.5"/>
    <text class="label" x="1070" y="356" text-anchor="middle" font-weight="600">Plan with your</text>
    <text class="label-sub" x="1070" y="380" text-anchor="middle">doctor</text>
  </g>
  <rect class="card" x="40" y="418" width="1120" height="178" rx="22"/>
  <text class="step-title" x="72" y="456">Cut-offs many centers use (check your lab's method)</text>
  <rect x="72" y="476" width="330" height="44" rx="8" fill="#E5D9C8"/>
  <rect x="406" y="476" width="330" height="44" fill="#D3C8BB"/>
  <rect x="740" y="476" width="388" height="44" rx="8" fill="#BDB5CA"/>
  <text class="label" x="237" y="505" text-anchor="middle" font-weight="600">Under 20%: reassuring</text>
  <text class="label" x="571" y="505" text-anchor="middle" font-weight="600">20% to 30%: borderline</text>
  <text class="label" x="934" y="505" text-anchor="middle" font-weight="600">30% or more: high</text>
  <text class="note" x="72" y="556">Testicular sperm is an option only if fragmentation stays above 30% after treatment.</text>
  <text class="note" x="72" y="582">Prices at Aurea Fertility Center as of 2026; your consult confirms the plan.</text>
</svg>
</body></html>
