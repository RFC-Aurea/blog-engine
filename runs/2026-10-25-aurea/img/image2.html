<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">After a euploid embryo result: your next steps</text>
  <text class="subtitle" x="40" y="96">Most of the plan is about the uterus and timing, not more tests on the embryo.</text>

  <rect class="card" x="32" y="122" width="1136" height="262" rx="22"/>
  <path d="M124,230 L1074,230" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="124" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="102" y="208" width="44" height="44"/>
    <circle class="badge" cx="92" cy="196" r="14"/><text class="badge-num" x="92" y="202" text-anchor="middle">1</text>
    <text class="label" x="124" y="304" text-anchor="middle">Rank embryos</text>
    <text class="label-sub" x="124" y="330" text-anchor="middle">grade and day</text>
  </g>
  <g>
    <circle cx="314" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-uterus" x="292" y="208" width="44" height="44"/>
    <circle class="badge" cx="282" cy="196" r="14"/><text class="badge-num" x="282" y="202" text-anchor="middle">2</text>
    <text class="label" x="314" y="304" text-anchor="middle">Check uterus</text>
    <text class="label-sub" x="314" y="330" text-anchor="middle">SIS $350 or</text>
    <text class="label-sub" x="314" y="352" text-anchor="middle">hysteroscopy $3,400</text>
  </g>
  <g>
    <circle cx="504" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="482" y="208" width="44" height="44"/>
    <circle class="badge" cx="472" cy="196" r="14"/><text class="badge-num" x="472" y="202" text-anchor="middle">3</text>
    <text class="label" x="504" y="304" text-anchor="middle">Monitored FET</text>
    <text class="label-sub" x="504" y="330" text-anchor="middle">$4,750 with</text>
    <text class="label-sub" x="504" y="352" text-anchor="middle">lining checks</text>
  </g>
  <g>
    <circle cx="694" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-check" x="672" y="208" width="44" height="44"/>
    <circle class="badge" cx="662" cy="196" r="14"/><text class="badge-num" x="662" y="202" text-anchor="middle">4</text>
    <text class="label" x="694" y="304" text-anchor="middle">Transfer one</text>
    <text class="label-sub" x="694" y="330" text-anchor="middle">single euploid</text>
    <text class="label-sub" x="694" y="352" text-anchor="middle">embryo</text>
  </g>
  <g>
    <circle cx="884" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="862" y="208" width="44" height="44"/>
    <circle class="badge" cx="852" cy="196" r="14"/><text class="badge-num" x="852" y="202" text-anchor="middle">5</text>
    <text class="label" x="884" y="304" text-anchor="middle">Review</text>
    <text class="label-sub" x="884" y="330" text-anchor="middle">embryo, cavity</text>
    <text class="label-sub" x="884" y="352" text-anchor="middle">and timing</text>
  </g>
  <g>
    <circle cx="1074" cy="230" r="40" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="1052" y="208" width="44" height="44"/>
    <circle class="badge" cx="1042" cy="196" r="14"/><text class="badge-num" x="1042" y="202" text-anchor="middle">6</text>
    <text class="label" x="1074" y="304" text-anchor="middle">After 3 failed</text>
    <text class="label-sub" x="1074" y="330" text-anchor="middle">full work-up</text>
    <text class="label-sub" x="1074" y="352" text-anchor="middle">(ASRM 2026)</text>
  </g>

  <rect class="card" x="32" y="400" width="556" height="204" rx="22"/>
  <text class="step-title" x="60" y="440">Worth checking</text>
  <use href="#icon-check" x="60" y="462" width="24" height="24"/><text class="label" x="94" y="481">Uterine cavity and tubes</text>
  <use href="#icon-check" x="60" y="502" width="24" height="24"/><text class="label" x="94" y="521">Lining and progesterone timing</text>
  <use href="#icon-check" x="60" y="542" width="24" height="24"/><text class="label" x="94" y="561">Embryo rank: grade, day</text>

  <rect class="card" x="604" y="400" width="564" height="204" rx="22"/>
  <text class="step-title" x="632" y="440">Not routinely recommended</text>
  <text class="label-sub" x="632" y="464">for repeated failed transfers (ASRM 2026)</text>
  <text class="label" x="632" y="502">Endometrial receptivity test (ERA)</text>
  <text class="label" x="632" y="536">Immune therapy, including IVIG</text>
  <text class="label" x="632" y="570">Endometrial scratching</text>
</svg>
</body></html>
