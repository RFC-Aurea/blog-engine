<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Egg donor IVF: time and steps</text>
  <text class="subtitle" x="40" y="96">Live birth odds were similar either way. Starting with donor eggs got there sooner.</text>

  <!-- panel 1: months to live birth -->
  <rect class="card" x="32" y="122" width="1136" height="214" rx="22"/>
  <text class="step-title" x="60" y="160">Months to the transfer that led to a live birth</text>

  <text class="label" x="60" y="214">Donor eggs first</text>
  <rect x="300" y="190" width="440" height="34" rx="8" fill="#A7B8A0"/>
  <text class="label" x="752" y="214">13.2 months</text>

  <text class="label" x="60" y="274">Own eggs first</text>
  <rect x="300" y="250" width="700" height="34" rx="8" fill="#CFC8BF"/>
  <text class="label" x="1012" y="274">21.0 months</text>

  <text class="note" x="60" y="318">Live birth after the first donor transfer: 59.2% vs. 53.1%. Clarke et al., 2025, 353 women.</text>

  <!-- panel 2: steps -->
  <rect class="card" x="32" y="352" width="1136" height="252" rx="22"/>
  <text class="step-title" x="60" y="390">How egg donor IVF works</text>
  <path d="M120,450 L1080,450" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="120" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="100" y="430" width="40" height="40"/>
    <text class="label" x="120" y="514" text-anchor="middle">Consult</text>
    <text class="label-sub" x="120" y="538" text-anchor="middle">and tests</text>
  </g>
  <g>
    <circle cx="312" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="292" y="430" width="40" height="40"/>
    <text class="label" x="312" y="514" text-anchor="middle">Choose donor</text>
    <text class="label-sub" x="312" y="538" text-anchor="middle">fresh or frozen</text>
  </g>
  <g>
    <circle cx="504" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="484" y="430" width="40" height="40"/>
    <text class="label" x="504" y="514" text-anchor="middle">Prepare lining</text>
    <text class="label-sub" x="504" y="538" text-anchor="middle">estrogen, then</text>
    <text class="label-sub" x="504" y="560" text-anchor="middle">progesterone</text>
  </g>
  <g>
    <circle cx="696" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="676" y="430" width="40" height="40"/>
    <text class="label" x="696" y="514" text-anchor="middle">Fertilize</text>
    <text class="label-sub" x="696" y="538" text-anchor="middle">often by ICSI</text>
  </g>
  <g>
    <circle cx="888" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-uterus" x="868" y="430" width="40" height="40"/>
    <text class="label" x="888" y="514" text-anchor="middle">Transfer</text>
    <text class="label-sub" x="888" y="538" text-anchor="middle">3 to 5 days later</text>
  </g>
  <g>
    <circle cx="1080" cy="450" r="34" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-drop" x="1060" y="430" width="40" height="40"/>
    <text class="label" x="1080" y="514" text-anchor="middle">Blood test</text>
    <text class="label-sub" x="1080" y="538" text-anchor="middle">about 2 weeks</text>
  </g>
</svg>
</body></html>
