<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Where diminished ovarian reserve treatment acts</text>
  <text class="subtitle" x="40" y="96">Fewer follicles means fewer eggs per cycle, not eggs that cannot become a baby.</text>

  <use href="#ovary-section" x="380" y="125" width="440" height="288.75"/>

  <path class="leader" d="M292,207 L443.5,241.9"/><circle class="leader-dot" cx="443.5" cy="241.9" r="3.5"/>
  <text class="label" x="40" y="204">Antral follicles</text>
  <text class="label-sub" x="40" y="227">2-10 mm, they make AMH</text>

  <path class="leader" d="M262,330 L421.3,324.4"/><circle class="leader-dot" cx="421.3" cy="324.4" r="3.5"/>
  <text class="label" x="40" y="327">Ovarian tissue</text>
  <text class="label-sub" x="40" y="350">PRP is injected here</text>

  <path class="leader" d="M872,257 L770.5,272.1"/><circle class="leader-dot" cx="770.5" cy="272.1" r="3.5"/>
  <text class="label" x="880" y="254">Growing follicle</text>
  <text class="label-sub" x="880" y="277">stimulation acts here</text>

  <path class="leader" d="M872,345 L712,313"/><circle class="leader-dot" cx="712" cy="313" r="3.5"/>
  <text class="label" x="880" y="342">Egg (oocyte)</text>
  <text class="label-sub" x="880" y="365">CoQ10 supports its energy</text>

  <rect class="card" x="40" y="438" width="265" height="162" rx="20"/>
  <circle cx="84" cy="482" r="30" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
  <use href="#icon-drop" x="62" y="460" width="44" height="44"/>
  <text class="step-title" x="128" y="490">Stimulation</text>
  <text class="step-text" x="60" y="548">Natural, mini or</text>
  <text class="step-text" x="60" y="574">conventional IVF</text>

  <rect class="card" x="322" y="438" width="265" height="162" rx="20"/>
  <circle cx="366" cy="482" r="30" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
  <use href="#icon-calendar" x="344" y="460" width="44" height="44"/>
  <text class="step-title" x="410" y="490">Pretreatment</text>
  <text class="step-text" x="342" y="548">CoQ10 or DHEA,</text>
  <text class="step-text" x="342" y="574">about 60 days</text>

  <rect class="card" x="604" y="438" width="265" height="162" rx="20"/>
  <circle cx="648" cy="482" r="30" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
  <use href="#icon-vial" x="626" y="460" width="44" height="44"/>
  <text class="step-title" x="692" y="490">Rejuvenation</text>
  <text class="step-text" x="624" y="548">PRP or adipose-PRP</text>
  <text class="step-text" x="624" y="574">into each ovary</text>

  <rect class="card" x="886" y="438" width="274" height="162" rx="20"/>
  <circle cx="930" cy="482" r="30" fill="#FBF8F3" stroke="#D9CFC2" stroke-width="2"/>
  <use href="#icon-dish" x="908" y="460" width="44" height="44"/>
  <text class="step-title" x="974" y="490">Donor eggs</text>
  <text class="step-text" x="906" y="548">From a donor, usually</text>
  <text class="step-text" x="906" y="574">aged 21 to 34</text>
</svg>
</body></html>
