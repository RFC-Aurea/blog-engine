<!doctype html>
<html><head><meta charset="utf-8"><style>{{BASE_CSS}}</style></head>
<body>
{{COMPONENTS}}
<svg class="canvas" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="1200" height="630"/>
  <text class="title" x="40" y="62">Getting pregnant with diminished ovarian reserve</text>
  <text class="subtitle" x="40" y="96">A starting order for treatment, reviewed after every retrieval.</text>
  <path d="M110,196 L1090,196" stroke="#D9CFC2" stroke-width="4" stroke-linecap="round"/>
  <g>
    <circle cx="110" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-clipboard" x="84" y="170" width="52" height="52"/>
    <circle class="badge" cx="76" cy="160" r="15"/><text class="badge-num" x="76" y="166" text-anchor="middle">1</text>
    <text class="step-title" x="110" y="282" text-anchor="middle">Test</text>
    <text class="step-title" x="110" y="307" text-anchor="middle">fully</text>
    <text class="step-text" x="110" y="338" text-anchor="middle">AMH, AFC, FSH,</text>
    <text class="step-text" x="110" y="361" text-anchor="middle">TSH, uterus</text>
  </g>
  <g>
    <circle cx="306" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-profile" x="280" y="170" width="52" height="52"/>
    <circle class="badge" cx="272" cy="160" r="15"/><text class="badge-num" x="272" y="166" text-anchor="middle">2</text>
    <text class="step-title" x="306" y="282" text-anchor="middle">Pick your</text>
    <text class="step-title" x="306" y="307" text-anchor="middle">protocol</text>
    <text class="step-text" x="306" y="338" text-anchor="middle">Natural, mini</text>
    <text class="step-text" x="306" y="361" text-anchor="middle">or conventional</text>
  </g>
  <g>
    <circle cx="502" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-calendar" x="476" y="170" width="52" height="52"/>
    <circle class="badge" cx="468" cy="160" r="15"/><text class="badge-num" x="468" y="166" text-anchor="middle">3</text>
    <text class="step-title" x="502" y="282" text-anchor="middle">Pretreat</text>
    <text class="step-title" x="502" y="307" text-anchor="middle">and correct</text>
    <text class="step-text" x="502" y="338" text-anchor="middle">CoQ10 or DHEA,</text>
    <text class="step-text" x="502" y="361" text-anchor="middle">about 60 days</text>
  </g>
  <g>
    <circle cx="698" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-microscope" x="672" y="170" width="52" height="52"/>
    <circle class="badge" cx="664" cy="160" r="15"/><text class="badge-num" x="664" y="166" text-anchor="middle">4</text>
    <text class="step-title" x="698" y="282" text-anchor="middle">Retrieve</text>
    <text class="step-title" x="698" y="307" text-anchor="middle">and review</text>
    <text class="step-text" x="698" y="338" text-anchor="middle">Count eggs</text>
    <text class="step-text" x="698" y="361" text-anchor="middle">and embryos</text>
  </g>
  <g>
    <circle cx="894" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-snowflake" x="868" y="170" width="52" height="52"/>
    <circle class="badge" cx="860" cy="160" r="15"/><text class="badge-num" x="860" y="166" text-anchor="middle">5</text>
    <text class="step-title" x="894" y="282" text-anchor="middle">Bank or</text>
    <text class="step-title" x="894" y="307" text-anchor="middle">add PRP</text>
    <text class="step-text" x="894" y="338" text-anchor="middle">2 or 3 retrievals,</text>
    <text class="step-text" x="894" y="361" text-anchor="middle">or rejuvenation</text>
  </g>
  <g>
    <circle cx="1090" cy="196" r="46" fill="#F1E9DE" stroke="#D9CFC2" stroke-width="2"/>
    <use href="#icon-dish" x="1064" y="170" width="52" height="52"/>
    <circle class="badge" cx="1056" cy="160" r="15"/><text class="badge-num" x="1056" y="166" text-anchor="middle">6</text>
    <text class="step-title" x="1090" y="282" text-anchor="middle">Donor eggs</text>
    <text class="step-title" x="1090" y="307" text-anchor="middle">if it fits</text>
    <text class="step-text" x="1090" y="338" text-anchor="middle">First, later, or</text>
    <text class="step-text" x="1090" y="361" text-anchor="middle">in parallel</text>
  </g>

  <rect class="card" x="40" y="420" width="1120" height="176" rx="22"/>
  <text class="step-title" x="72" y="462">Questions to ask your doctor</text>
  <use href="#icon-check" x="72" y="486" width="26" height="26"/>
  <text class="label" x="110" y="506">Which protocol fits my AMH and AFC?</text>
  <use href="#icon-check" x="72" y="538" width="26" height="26"/>
  <text class="label" x="110" y="558">How many embryos should we bank?</text>
  <use href="#icon-check" x="620" y="486" width="26" height="26"/>
  <text class="label" x="658" y="506">When would ovarian PRP make sense?</text>
  <use href="#icon-check" x="620" y="538" width="26" height="26"/>
  <text class="label" x="658" y="558">What result would suggest donor eggs?</text>
</svg>
</body></html>
